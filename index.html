<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HM 3D Tech - Bio Link</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Hiệu ứng chữ 3D (Nếu bạn muốn dùng lại chữ, nếu không có thể xóa) */
        .title-3d {
            background: linear-gradient(to bottom, #44adff 0%, #0050ff 60%, #001080 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 1px 0 #002ba1, 0 2px 0 #002896, 0 3px 0 #00248a, 0 4px 0 #00217f, 0 5px 0 #001e74, 0 6px 0 #001b69, 0 8px 10px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

<!-- NỀN TRANG WEB: Load từ bg.png -->
<body class="min-h-screen bg-cover bg-center bg-no-repeat bg-fixed flex justify-center items-center font-sans" 
      style="background-image: url('bg.png');">
    
    <!-- KHUNG CHỨA (Mô phỏng màn hình điện thoại) -->
    <div class="w-full max-w-[420px] px-5 py-8 flex flex-col items-center relative z-10">
        
        <!-- LOGO (0.png) -->
        <img src="0.png" alt="HM 3D Tech Logo" class="w-40 h-auto mb-4 drop-shadow-2xl">

        <!-- CÁC NÚT BẤM (1.png -> 5.png) -->
        <div class="w-full flex flex-col space-y-4 mb-8">
            <!-- Shopee -->
            <a href="LINK_SHOPEE_CUA_BAN" class="w-full block hover:scale-105 active:scale-95 transition-transform duration-300">
                <img src="1.png" alt="Shopee" class="w-full h-auto">
            </a>
            
            <!-- TikTok -->
            <a href="LINK_TIKTOK_CUA_BAN" class="w-full block hover:scale-105 active:scale-95 transition-transform duration-300">
                <img src="2.png" alt="TikTok" class="w-full h-auto">
            </a>
            
            <!-- Facebook -->
            <a href="LINK_FACEBOOK_CUA_BAN" class="w-full block hover:scale-105 active:scale-95 transition-transform duration-300">
                <img src="3.png" alt="Facebook" class="w-full h-auto">
            </a>
            
            <!-- Zalo -->
            <a href="LINK_ZALO_CUA_BAN" class="w-full block hover:scale-105 active:scale-95 transition-transform duration-300">
                <img src="4.png" alt="Zalo" class="w-full h-auto">
            </a>
            
            <!-- Gọi điện -->
            <a href="tel:0379861910" class="w-full block hover:scale-105 active:scale-95 transition-transform duration-300">
                <img src="5.png" alt="Gọi đặt hàng" class="w-full h-auto">
            </a>
        </div>

        <!-- 4 ICON TÍNH NĂNG (6.jpg) -->
        <!-- Mẹo: Dùng mix-blend-multiply để khử phần nền trắng của ảnh JPG, giúp nó hòa trộn tuyệt đẹp vào nền xanh mây bg.png -->
        <div class="w-full mb-6 pointer-events-none">
            <img src="6.jpg" alt="Features" class="w-full h-auto mix-blend-multiply opacity-90">
        </div>

        <!-- CHỮ KÝ CẢM ƠN (7.jpg) -->
        <div class="w-full mt-4 pointer-events-none">
            <img src="7.jpg" alt="Cảm ơn bạn đã ghé HM 3D Tech" class="w-[85%] h-auto mx-auto mix-blend-multiply">
        </div>

    </div>
</body>
</html>
